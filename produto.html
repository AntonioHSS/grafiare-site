<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grafiare — Produto</title>
  <meta name="description" content="Detalhes do produto Grafiare." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="assets/logo.png" alt="Grafiare" />
      </a>
      <nav class="nav">
        <a href="index.html">Inicial</a>
        <a href="empresa.html">Empresa</a>
        <a href="catalogo-cores.html">Catálogo de cores</a>
        <a href="produtos.html">Produtos</a>
        <a href="contato.html">Contato</a>
      </nav>
      <button class="cart-toggle" id="cartToggle" aria-label="Abrir orçamento">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </button>
    </div>
  </header>

  <section style="padding: 40px 0;">
    <div class="container">
      <div class="product-page" id="productPage">
        <div class="product-loading" id="productLoading">Carregando produto...</div>
        <div class="product-content" id="productContent" hidden>
          <div class="product-image">
            <img id="productImg" src="" alt="" />
          </div>
          <div class="product-info">
            <div class="product-header">
              <span class="product-cat" id="productCat"></span>
              <h1 id="productName"></h1>
              <div class="product-meta">
                <span class="product-code">Código: <span id="productCode"></span></span>
                <span class="product-price" id="productPrice"></span>
              </div>
            </div>
            <p class="product-description" id="productDesc"></p>
            <div class="product-bulletin">
              <h3>Boletim Técnico</h3>
              <ul id="productBulletin"></ul>
            </div>
            <div class="product-actions" style="margin-top: 24px;">
              <button class="btn btn-primary btn-block" id="addToCartBtn">Adicionar ao orçamento</button>
              <a href="produtos.html" class="btn btn-ghost btn-block" style="color:#142864; border-color:#142864;">Voltar ao catálogo</a>
            </div>
          </div>
        </div>
        <div class="product-error" id="productError" hidden>
          <p>Produto não encontrado.</p>
          <a href="produtos.html" class="btn btn-primary">Voltar ao catálogo</a>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> GRAFIARE. Todos os direitos reservados.</p>
    </div>
  </footer>

  <aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
    <div class="cart-head">
      <h3>Seu Orçamento</h3>
      <button class="modal-close" id="cartClose" aria-label="Fechar">&times;</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot">
      <div class="cart-total">
        <span>Itens:</span>
        <strong id="cartCount">0</strong>
      </div>
      <button class="btn btn-primary btn-block" id="sendWhatsApp">Enviar orçamento pelo WhatsApp</button>
      <button class="btn btn-ghost btn-block" id="clearCart">Limpar lista</button>
    </div>
  </aside>
  <div class="cart-overlay" id="cartOverlay" hidden></div>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get("id");
      const loading = document.getElementById("productLoading");
      const content = document.getElementById("productContent");
      const error = document.getElementById("productError");

      if (!code) {
        loading.hidden = true;
        error.hidden = false;
        return;
      }

      const p = window.PRODUCTS.find(x => x.code === code);
      if (!p) {
        loading.hidden = true;
        error.hidden = false;
        return;
      }

      // Preencher dados
      document.getElementById("productCat").textContent = catLabel(p.category);
      document.getElementById("productCat").style.color = "var(--accent-dark)";
      document.getElementById("productCat").style.fontWeight = "600";
      document.getElementById("productCat").style.textTransform = "uppercase";
      document.getElementById("productCat").style.fontSize = "13px";
      document.getElementById("productCat").style.letterSpacing = "1px";

      document.getElementById("productName").textContent = p.name;
      document.getElementById("productCode").textContent = p.code;
      document.getElementById("productPrice").textContent = p.price || "Consulte";
      document.getElementById("productDesc").textContent = p.description;

      const img = document.getElementById("productImg");
      img.src = p.image;
      img.alt = p.name;
      img.onerror = function() {
        this.style.display = "none";
      };

      // Boletim técnico
      const bulletinList = document.getElementById("productBulletin");
      bulletinList.innerHTML = "";
      if (p.bulletin && p.bulletin.length > 0) {
        p.bulletin.forEach(line => {
          const li = document.createElement("li");
          li.textContent = line;
          bulletinList.appendChild(li);
        });
      } else {
        const li = document.createElement("li");
        li.textContent = "Boletim técnico não disponível.";
        li.style.color = "var(--muted)";
        bulletinList.appendChild(li);
      }

      // Botão adicionar ao carrinho
      const addBtn = document.getElementById("addToCartBtn");
      addBtn.addEventListener("click", () => {
        addToCart(p.id);
        // Abrir carrinho
        const drawer = document.getElementById("cartDrawer");
        const overlay = document.getElementById("cartOverlay");
        if (drawer) drawer.classList.add("open");
        if (overlay) overlay.hidden = false;
      });

      loading.hidden = true;
      content.hidden = false;
    });
  </script>
</body>
</html>
