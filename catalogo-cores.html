<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grafiare — Catálogo de cores</title>
  <meta name="description" content="Catálogo de cores da Grafiare." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="assets/logo.png" alt="Grafiare" />
      </a>
      <nav class="nav">
        <a href="index.html">Inicial</a>
        <a href="empresa.html">Empresa</a>
        <a href="catalogo-cores.html" class="active">Catálogo de cores</a>
        <a href="produtos.html">Produtos</a>
        <a href="contato.html">Contato</a>
      </nav>
      <button class="cart-toggle" id="cartToggle" aria-label="Abrir orçamento">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </button>
    </div>
  </header>

  <section class="hero" style="padding: 48px 0;">
    <div class="container hero-inner">
      <div class="hero-text">
        <span class="eyebrow">CATÁLOGO DE CORES</span>
        <h1>Cores disponíveis</h1>
        <p>Cores do catálogo Grafiare em ordem. Clique/toque para ampliar.</p>
      </div>
    </div>
  </section>

  <section style="padding: 60px 0;">
    <div class="container">
      <div class="carousel" id="carousel">
        <div class="carousel-track" id="carouselTrack"></div>
        <button class="carousel-btn prev" id="prevBtn" aria-label="Anterior">&#10094;</button>
        <button class="carousel-btn next" id="nextBtn" aria-label="Próximo">&#10095;</button>
      </div>
      <div class="carousel-dots" id="carouselDots"></div>
      <div class="carousel-counter" id="carouselCounter"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> GRAFIARE. Todos os direitos reservados.</p>
    </div>
  </footer>

  <aside class="cart-drawer" id="cartDrawer" aria-hidden="true">
    <div class="cart-head">
      <h3>Seu Orçamento</h3>
      <button class="modal-close" id="cartClose" aria-label="Fechar">&times;</button>
    </div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot">
      <div class="cart-total">
        <span>Itens:</span>
        <strong id="cartCount">0</strong>
      </div>
      <button class="btn btn-primary btn-block" id="sendWhatsApp">Enviar orçamento pelo WhatsApp</button>
      <button class="btn btn-ghost btn-block" id="clearCart">Limpar lista</button>
    </div>
  </aside>
  <div class="cart-overlay" id="cartOverlay" hidden></div>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const carousel = document.getElementById("carousel");
      const track = document.getElementById("carouselTrack");
      const dots = document.getElementById("carouselDots");
      const counter = document.getElementById("carouselCounter");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      if (!track) return;

      const TOTAL = 34;
      let index = 0;
      let timer = null;

      for (let i = 1; i <= TOTAL; i++) {
        const slide = document.createElement("div");
        slide.className = "carousel-slide";
        const img = document.createElement("img");
        img.src = `assets/cores/${i}.png`;
        img.alt = `Grafiare cor ${i}`;
        img.loading = "eager";
        slide.appendChild(img);
        track.appendChild(slide);

        const dot = document.createElement("button");
        dot.className = "carousel-dot";
        dot.type = "button";
        dot.setAttribute("aria-label", `Ir para cor ${i}`);
        dot.addEventListener("click", () => goTo(i - 1));
        dots.appendChild(dot);
      }

      function update() {
        track.style.transform = `translateX(-${index * 100}%)`;
        Array.from(dots.children).forEach((d, i) => d.classList.toggle("active", i === index));
        if (counter) counter.textContent = `${index + 1} / ${TOTAL}`;
      }
      function goTo(n) {
        index = (n + TOTAL) % TOTAL;
        update();
      }
      function startAuto() {
        stopAuto();
        timer = setInterval(() => goTo(index + 1), 4500);
      }
      function stopAuto() { if (timer) { clearInterval(timer); timer = null; } }

      prevBtn.addEventListener("click", () => { stopAuto(); goTo(index - 1); startAuto(); });
      nextBtn.addEventListener("click", () => { stopAuto(); goTo(index + 1); startAuto(); });
      carousel.addEventListener("mouseenter", stopAuto);
      carousel.addEventListener("mouseleave", startAuto);

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") { stopAuto(); goTo(index - 1); startAuto(); }
        if (e.key === "ArrowRight") { stopAuto(); goTo(index + 1); startAuto(); }
      });

      update();
      startAuto();
    });
  </script>
</body>
</html>
